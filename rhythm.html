<!doctype html>
<html>
    <head>
        <title>deltarhythm</title>
        <!--<link
            rel="icon"
            type="image/x-icon"
            href="assets/img/desktop/icons/favicon.ico"
            />-->
        <link rel="stylesheet" href="rhythm.css" />
        <script src="jquery.js"></script>
        <script src="jszip.min.js"></script>
    </head>
    <body id="bodyContainer">
        <div
            id="templateNoteHolder"
            class="noteHolder"
            style="visibility: hidden; z-index: 1;"
        >
            <img
                src="assets/img/notes/fullNote.png"
                class="note"
                style="width: 100%; height: 100%"
                draggable="false"
            />
        </div>
        <input type="file" id="fileInput" accept=".deltazip" multiple style="z-index: 6; color: white;" />
        <div id="gameHolder">
            <img
                src="assets/img/background.png"
                id="bg"
                style="width: 100%; height: 100%; visibility: visible;"
                draggable="false"
            />
            <div id="horizontalLane" class="lane"></div>
            <div id="verticalLane" class="lane"></div>
            <div id="battleBoxDiv">
                <img
                    src="assets/img/battleBox.png"
                    id="battleBox"
                    draggable="false"
                />
                <div id="soulHolder">
                    <img
                        src="assets/img/soul.png"
                        id="soul"
                        style="left: 45%; top: 45%"
                        draggable="false"
                    />
                </div>
            </div>
        </div>
        <div id="uiHolder">
            <div id="templateSongHolder" class="songHolder" style="visibility: hidden;">
                <img
                    src="assets/img/songButton.png"
                    class="songButton"
                    draggable="false"
                />
                <img
                    src="assets/img/cover.png"
                    class="cover"
                    draggable="false"
                />
                <h1 class="sngName">name</h1>
            </div>
        </div>
        <div class="noteStopper" style="width: 7%; height: 100%; left: 0%; top: 0%;"></div>
        <script src="rhythm.js"></script>
    </body>
</html>
